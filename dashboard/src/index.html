<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Page Views Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .status.connected {
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid #4CAF50;
        }

        .status.disconnected {
            background: rgba(244, 67, 54, 0.3);
            border: 1px solid #f44336;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.3em;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .metric {
            margin-bottom: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .metric-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 15px;
        }

        .top-items {
            margin-top: 15px;
        }

        .top-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .top-item-name {
            flex: 1;
            color: #333;
            font-weight: 500;
        }

        .top-item-count {
            color: #667eea;
            font-weight: bold;
            font-size: 1.1em;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .page-views-stream {
            grid-column: 1 / -1;
        }

        .stream-container {
            max-height: 300px;
            overflow-y: auto;
        }

        .stream-item {
            padding: 10px;
            border-left: 4px solid #667eea;
            background: #f9f9f9;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 0.9em;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .stream-item-time {
            color: #999;
            font-size: 0.85em;
        }

        .stream-item-content {
            color: #333;
            margin-top: 3px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }
        }

        .counts-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .counts-table thead {
            background: #f0f0f0;
        }

        .counts-table th,
        .counts-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .counts-table th {
            color: #667eea;
            font-weight: 600;
        }

        .counts-table td {
            color: #333;
        }

        .counts-table tr:hover {
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Realtime Dashboard</h1>
            <div class="status disconnected" id="status">
                ● Connecting...
            </div>
        </header>

        <div class="dashboard">
            <!-- Page Views Statistics -->
            <div class="card">
                <h2>📈 Page Views</h2>
                <div class="metric">
                    <div class="metric-label">Total Events</div>
                    <div class="metric-value" id="totalEvents">0</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Active Postcodes</div>
                    <div class="metric-value" id="activePostcodes">0</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Top Webpages</div>
                    <div class="top-items" id="topWebpages"></div>
                </div>
            </div>

            <!-- Postcode Distribution -->
            <div class="card">
                <h2>📍 Postcode Distribution</h2>
                <div class="chart-container">
                    <canvas id="postcodeChart"></canvas>
                </div>
                <div class="top-items" id="topPostcodes"></div>
            </div>

            <!-- Aggregated Page Views Count -->
            <div class="card">
                <h2>⏱️ Aggregated Counts (1-Minute Windows)</h2>
                <div class="chart-container">
                    <canvas id="countsChart"></canvas>
                </div>
                <div style="max-height: 200px; overflow-y: auto;">
                    <table class="counts-table">
                        <thead>
                            <tr>
                                <th>Postcode</th>
                                <th>Total Views</th>
                                <th>Window</th>
                            </tr>
                        </thead>
                        <tbody id="countsTable">
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Page Views Stream -->
            <div class="card page-views-stream">
                <h2>🔄 Live Stream</h2>
                <div class="stream-container" id="liveStream">
                    <div style="padding: 20px; text-align: center; color: #999;">
                        Waiting for data...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let postcodeChart = null;
        let countsChart = null;
        let pageviewsWS = null;
        let countsWS = null;
        const streamItems = [];
        const MAX_STREAM_ITEMS = 50;

        // Get WebSocket URL with correct protocol
        function getWSUrl(endpoint) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${protocol}//${window.location.host}${endpoint}`;
        }

        // Initialize WebSocket for page views
        function connectPageviewsWS() {
            const wsUrl = getWSUrl('/ws/pageviews');
            console.log('Connecting to pageviews WS:', wsUrl);
            pageviewsWS = new WebSocket(wsUrl);

            pageviewsWS.onopen = () => {
                console.log('Connected to pageviews stream');
                updateStatus(true);
                // Send a ping to keep the connection alive
                setInterval(() => {
                    if (pageviewsWS.readyState === WebSocket.OPEN) {
                        pageviewsWS.send(JSON.stringify({type: 'ping'}));
                    }
                }, 30000);
            };

            pageviewsWS.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    console.log('Received pageviews message:', message);
                    
                    if (message.type === 'initial') {
                        updatePageViewsStats(message.stats);
                    } else if (message.type === 'pageview') {
                        updatePageViewsStats(message.stats);
                        addStreamItem(message.data);
                    }
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };

            pageviewsWS.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            pageviewsWS.onclose = () => {
                console.log('Disconnected from pageviews stream');
                updateStatus(false);
                setTimeout(connectPageviewsWS, 3000);
            };
        }

        // Initialize WebSocket for counts
        function connectCountsWS() {
            const wsUrl = getWSUrl('/ws/counts');
            console.log('Connecting to counts WS:', wsUrl);
            countsWS = new WebSocket(wsUrl);

            countsWS.onopen = () => {
                console.log('Connected to counts stream');
                // Send a ping to keep the connection alive
                setInterval(() => {
                    if (countsWS.readyState === WebSocket.OPEN) {
                        countsWS.send(JSON.stringify({type: 'ping'}));
                    }
                }, 30000);
            };

            countsWS.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    console.log('Received counts message:', message);
                    
                    if (message.type === 'initial') {
                        updateCountsData(message.counts);
                    } else if (message.type === 'count_update') {
                        updateCountsData(message.all_counts);
                    }
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };

            countsWS.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            countsWS.onclose = () => {
                console.log('Disconnected from counts stream');
                setTimeout(connectCountsWS, 3000);
            };
        }

        // Update page views statistics
        function updatePageViewsStats(stats) {
            document.getElementById('totalEvents').textContent = stats.total_events.toLocaleString();
            document.getElementById('activePostcodes').textContent = Object.keys(stats.pageviews_by_postcode).length;

            // Update postcode distribution
            updatePostcodeChart(stats.pageviews_by_postcode);
            updateTopPostcodes(stats.pageviews_by_postcode);

            // Update top webpages
            updateTopWebpages(stats.top_webpages);
        }

        // Update counts data
        function updateCountsData(counts) {
            updateCountsChart(counts);
            updateCountsTable(counts);
        }

        // Update postcode chart
        function updatePostcodeChart(postcodes) {
            const labels = Object.keys(postcodes).slice(0, 10);
            const data = labels.map(pc => postcodes[pc]);
            const total = data.reduce((a, b) => a + b, 0);

            if (!postcodeChart) {
                const ctx = document.getElementById('postcodeChart').getContext('2d');
                postcodeChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: data,
                            backgroundColor: [
                                '#667eea', '#764ba2', '#f093fb', '#4facfe', '#00f2fe',
                                '#43e97b', '#fa709a', '#fee140', '#30cfd0', '#330867'
                            ],
                            borderColor: 'white',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
            } else {
                postcodeChart.data.labels = labels;
                postcodeChart.data.datasets[0].data = data;
                postcodeChart.update();
            }
        }

        // Update counts chart
        function updateCountsChart(counts) {
            const labels = Object.keys(counts).slice(0, 10);
            const data = labels.map(pc => counts[pc].total_views);

            if (!countsChart) {
                const ctx = document.getElementById('countsChart').getContext('2d');
                countsChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Views per Postcode (1-min window)',
                            data: data,
                            backgroundColor: 'rgba(102, 126, 234, 0.8)',
                            borderColor: 'rgba(102, 126, 234, 1)',
                            borderWidth: 1,
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            }
                        }
                    }
                });
            } else {
                countsChart.data.labels = labels;
                countsChart.data.datasets[0].data = data;
                countsChart.update();
            }
        }

        // Update top postcodes list
        function updateTopPostcodes(postcodes) {
            const sorted = Object.entries(postcodes)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            const html = sorted.map(([pc, count]) => {
                const total = Object.values(postcodes).reduce((a, b) => a + b, 0);
                const percentage = (count / total * 100).toFixed(1);
                return `
                    <div class="top-item">
                        <div class="top-item-name">${pc}</div>
                        <div class="top-item-count">${count}</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${percentage}%"></div>
                    </div>
                `;
            }).join('');

            document.getElementById('topPostcodes').innerHTML = html;
        }

        // Update top webpages list
        function updateTopWebpages(webpages) {
            const sorted = Object.entries(webpages)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            const html = sorted.map(([webpage, count]) => `
                <div class="top-item">
                    <div class="top-item-name">${webpage}</div>
                    <div class="top-item-count">${count}</div>
                </div>
            `).join('');

            document.getElementById('topWebpages').innerHTML = html || '<p style="color: #999;">No data yet</p>';
        }

        // Update counts table
        function updateCountsTable(counts) {
            const rows = Object.entries(counts)
                .sort((a, b) => b[1].total_views - a[1].total_views)
                .slice(0, 10)
                .map(([pc, data]) => {
                    const startTime = new Date(data.start_at).toLocaleTimeString();
                    const endTime = new Date(data.end_at).toLocaleTimeString();
                    return `
                        <tr>
                            <td>${pc}</td>
                            <td>${data.total_views}</td>
                            <td>${startTime} - ${endTime}</td>
                        </tr>
                    `;
                }).join('');

            document.getElementById('countsTable').innerHTML = rows;
        }

        // Add item to live stream
        function addStreamItem(data) {
            const time = new Date(data.timestamp).toLocaleTimeString();
            const item = `
                <div class="stream-item">
                    <div class="stream-item-time">${time}</div>
                    <div class="stream-item-content">
                        User ${data.user_id} from <strong>${data.postcode}</strong> viewed <strong>${data.webpage}</strong>
                    </div>
                </div>
            `;

            const container = document.getElementById('liveStream');
            if (container.querySelector('[style*="Waiting"]')) {
                container.innerHTML = '';
            }

            container.insertAdjacentHTML('afterbegin', item);
            streamItems.unshift(item);

            if (streamItems.length > MAX_STREAM_ITEMS) {
                const removed = container.querySelectorAll('.stream-item');
                if (removed.length > MAX_STREAM_ITEMS) {
                    removed[removed.length - 1].remove();
                }
            }
        }

        // Update connection status
        function updateStatus(connected) {
            const status = document.getElementById('status');
            if (connected) {
                status.className = 'status connected';
                status.textContent = '● Connected';
            } else {
                status.className = 'status disconnected';
                status.textContent = '● Connecting...';
            }
        }

        // Initialize
        console.log('Initializing dashboard...');
        connectPageviewsWS();
        connectCountsWS();
    </script>
</body>
</html>
